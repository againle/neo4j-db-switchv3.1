<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MemChat — Client Simulator</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2330;
    --border: #2b3342;
    --text: #e6e9ef;
    --muted: #8b95a5;
    --accent: #7c6cf0;
    --accent-2: #4fc3f7;
    --trainee: #2f81f7;
    --client: #21262f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
  header h1 span { color: var(--accent); }
  header .meta { font-size: 12px; color: var(--muted); display: flex; gap: 14px; align-items: center; }
  header a { color: var(--accent-2); text-decoration: none; font-size: 12px; }
  header a:hover { text-decoration: underline; }
  #session-id { font-family: monospace; font-size: 11px; }
  #btn-new {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
  #btn-new:hover { border-color: var(--accent); }
  #profile {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; font-size: 12px; font-family: inherit;
  }

  main { flex: 1; display: flex; min-height: 0; }
  #chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 24px 20%; display: flex; flex-direction: column; gap: 14px; }
  @media (max-width: 1200px) { #messages { padding: 20px 6%; } }

  .msg { max-width: 78%; padding: 11px 15px; border-radius: 14px; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; }
  .msg.selectable { cursor: pointer; }
  .msg.selectable:hover { filter: brightness(1.08); }
  .msg.trainee { align-self: flex-end; background: var(--trainee); color: #fff; border-bottom-right-radius: 4px; }
  .msg.client { align-self: flex-start; background: var(--client); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.active { outline: 2px solid var(--accent); }
  .msg .who { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 4px; }
  .msg.trainee .who { color: rgba(255,255,255,0.65); }

  #typing { display: none; align-self: flex-start; padding: 12px 16px; background: var(--client); border: 1px solid var(--border); border-radius: 14px; border-bottom-left-radius: 4px; }
  #typing span { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  #typing span:nth-child(2) { animation-delay: 0.2s; } #typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  #composer { display: flex; gap: 10px; padding: 14px 20% 18px; border-top: 1px solid var(--border); background: var(--panel); }
  @media (max-width: 1200px) { #composer { padding: 14px 6% 16px; } }
  #input {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 12px 14px; font-size: 14.5px; font-family: inherit; resize: none; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 0 22px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: 0.45; cursor: not-allowed; }

  #inspector {
    width: 340px; border-left: 1px solid var(--border); background: var(--panel);
    padding: 18px; overflow-y: auto; flex-shrink: 0;
  }
  #inspector h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 14px; }
  #inspector .empty { color: var(--muted); font-size: 13px; line-height: 1.6; }
  .card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .card .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; }
  .card .value { font-size: 13.5px; line-height: 1.5; }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: rgba(124,108,240,0.18); color: var(--accent); border: 1px solid var(--accent); }
  .emotion-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  #concepts { display: flex; flex-wrap: wrap; gap: 6px; }
  #concepts .chip { background: rgba(79,195,247,0.12); color: var(--accent-2); border-color: var(--accent-2); font-weight: 500; }
  .concepts-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 14px 0 8px; }
</style>
</head>
<body>
<header>
  <h1>Mem<span>Chat</span> — GraphRAG Client Simulator</h1>
  <div class="meta">
    <label for="profile">Client</label>
    <select id="profile"></select>
    <span id="session-id"></span>
    <a href="http://localhost:17474" target="_blank" rel="noopener">Neo4j Browser</a>
    <button id="btn-new">New Session</button>
  </div>
</header>
<main>
  <div id="chat-col">
    <div id="messages"></div>
    <div id="typing"><span></span><span></span><span></span></div>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="Speak to the client as the therapist… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </div>
  <aside id="inspector">
    <h2>Client Internal State</h2>
    <div id="inspector-body"><p class="empty">Send a message. Click any therapist or client bubble to inspect that turn.</p></div>
  </aside>
</main>

<script>
let sessionId = null;
let profiles = [];
let activeProfile = null;
const turns = [];
const messagesEl = document.getElementById('messages');
const typingEl = document.getElementById('typing');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

async function loadProfiles() {
  const res = await fetch('/api/profiles');
  const data = await res.json();
  profiles = data.profiles || [];
  const select = document.getElementById('profile');
  select.innerHTML = profiles.map(p =>
    `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}, ${p.age}</option>`
  ).join('');
  if (!profiles.length) {
    messagesEl.innerHTML = '';
    addMessage('client', '[error] No client profiles are seeded.', -1);
  }
}

async function newSession() {
  const profileName = document.getElementById('profile').value;
  if (!profileName) return;
  const res = await fetch('/api/session', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ profile_name: profileName }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || 'could not start session');
  sessionId = data.session_id;
  activeProfile = profiles.find(p => p.name === data.profile_name) || { name: data.profile_name, age: '', background: '' };
  document.getElementById('session-id').textContent = activeProfile.name + ' · ' + sessionId.slice(0, 8);
  messagesEl.innerHTML = '';
  turns.length = 0;
  renderInspector(null);
}

function addMessage(role, text, turnIdx) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<span class="who">${role === 'trainee' ? 'Therapist (you)' : 'Client'}</span>`;
  div.appendChild(document.createTextNode(text));
  if (turnIdx !== undefined && turnIdx !== null && turnIdx >= 0) {
    bindInspect(div, turnIdx);
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function bindInspect(div, turnIdx) {
  div.dataset.turnIndex = String(turnIdx);
  div.classList.add('selectable');
  div.addEventListener('click', () => selectTurn(turnIdx));
}

function selectTurn(turnIdx) {
  document.querySelectorAll('.msg').forEach(m => {
    m.classList.toggle('active', m.dataset.turnIndex === String(turnIdx));
  });
  renderInspector(turns.find(t => t.turn_index === turnIdx));
}

function renderInspector(turn) {
  const body = document.getElementById('inspector-body');
  if (!turn) {
    const who = activeProfile
      ? `<p class="empty"><strong>${escapeHtml(activeProfile.name)}</strong>${activeProfile.age ? ', ' + activeProfile.age : ''}. ${escapeHtml(activeProfile.background || '')}</p>`
      : '';
    body.innerHTML = who + '<p class="empty">Send a message. Click any therapist or client bubble to inspect that turn.</p>';
    return;
  }
  const s = turn.state;
  const emotionChips = (s.emotions || []).map(e => `<span class="chip">${escapeHtml(e)}</span>`).join('') || '<span class="empty">—</span>';
  body.innerHTML = `
    <div class="card"><div class="label">Turn</div><div class="value">#${turn.turn_index}</div></div>
    <div class="card"><div class="label">Automatic Thought</div><div class="value">${escapeHtml(s.automatic_thought)}</div></div>
    <div class="card"><div class="label">Emotions</div>
      <div class="emotion-chips">${emotionChips}</div>
    </div>
    <div class="card"><div class="label">Coping Mode Activated</div><div class="value">${escapeHtml(s.coping_mode_activated)}</div></div>
    <div class="concepts-title">Beliefs triggered this turn</div>
    <div id="concepts">${(turn.triggered_beliefs || []).map(b => `<span class="chip" title="${escapeHtml(b.text)}">${escapeHtml(_shortBelief(b.text))} · ${Number(b.similarity).toFixed(2)}</span>`).join('') || '<span class="empty">— none above threshold</span>'}</div>
  `;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function _shortBelief(text) {
  return text.length > 72 ? text.slice(0, 69) + '…' : text;
}

document.getElementById('composer').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text || !sessionId) return;
  inputEl.value = '';
  sendBtn.disabled = true;
  const traineeDiv = addMessage('trainee', text);
  typingEl.style.display = 'block';
  messagesEl.scrollTop = messagesEl.scrollHeight;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'request failed');
    typingEl.style.display = 'none';
    turns.push(data);
    bindInspect(traineeDiv, data.turn_index);
    addMessage('client', data.dialogue_response, data.turn_index);
    selectTurn(data.turn_index);
  } catch (err) {
    typingEl.style.display = 'none';
    addMessage('client', '[error] ' + err.message, -1);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
});
document.getElementById('btn-new').addEventListener('click', () => {
  newSession().catch(err => addMessage('client', '[error] ' + err.message, -1));
});
document.getElementById('profile').addEventListener('change', () => {
  newSession().catch(err => addMessage('client', '[error] ' + err.message, -1));
});

loadProfiles().then(newSession).catch(err => addMessage('client', '[error] ' + err.message, -1));
</script>
</body>
</html>
